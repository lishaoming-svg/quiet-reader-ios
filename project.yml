name: QuietReader
options:
  bundleIdPrefix: com.quietreader
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  generateEmptyDirectories: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.5
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  KindleDocumentKit:
    path: Packages/KindleDocumentKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  QuietReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
      - package: KindleDocumentKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 墨阅
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 用于扫描用户电脑上显示的听书生成器配对二维码。
        NSLocalNetworkUsageDescription: 用于连接同一局域网内由用户启动的墨阅听书生成器。
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 墨阅伴读包
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.quietreader.readaloud-package
          - CFBundleTypeName: 本地图书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - com.quietreader.mobi
              - com.quietreader.azw
              - com.quietreader.azw3
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.quietreader.mobi
            UTTypeDescription: Kindle MOBI 图书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mobi]
          - UTTypeIdentifier: com.quietreader.azw
            UTTypeDescription: Kindle AZW 图书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw]
          - UTTypeIdentifier: com.quietreader.azw3
            UTTypeDescription: Kindle AZW3 图书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.quietreader.readaloud-package
            UTTypeDescription: 墨阅逐句伴读包
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - qraudio
              public.mime-type:
                - application/vnd.quietreader.readaloud+zip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.app
        MARKETING_VERSION: 0.9.0
        CURRENT_PROJECT_VERSION: 31
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  QuietReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: QuietReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.tests
  QuietReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: QuietReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuietReader
  QuietReaderLiveSourceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiveSourceTests
    dependencies:
      - target: QuietReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.live-source-tests
schemes:
  QuietReader:
    build:
      targets:
        QuietReader: all
        QuietReaderTests: [test]
        QuietReaderUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - QuietReaderTests
        - QuietReaderUITests
  QuietReaderLiveSources:
    build:
      targets:
        QuietReader: all
        QuietReaderLiveSourceTests: [test]
    test:
      targets:
        - QuietReaderLiveSourceTests
