name: QuietReader
options:
  bundleIdPrefix: com.quietreader
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.13.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  QuietReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 墨阅
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.app
        MARKETING_VERSION: 0.5.5
        CURRENT_PROJECT_VERSION: 14
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  QuietReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: QuietReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.tests
  QuietReaderLiveSourceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiveSourceTests
    dependencies:
      - target: QuietReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietreader.live-source-tests
schemes:
  QuietReader:
    build:
      targets:
        QuietReader: all
        QuietReaderTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - QuietReaderTests
  QuietReaderLiveSources:
    build:
      targets:
        QuietReader: all
        QuietReaderLiveSourceTests: [test]
    test:
      targets:
        - QuietReaderLiveSourceTests
