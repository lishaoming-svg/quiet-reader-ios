name: 在线书源冒烟测试

on:
  workflow_dispatch:

jobs:
  curated-sources:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 实测精选源搜索链路
        run: bash scripts/run-live-source-smoke.sh
