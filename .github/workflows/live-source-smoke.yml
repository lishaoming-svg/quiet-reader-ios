name: 在线书源冒烟测试

on:
  workflow_dispatch:

jobs:
  dalanglang:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 实测大灰狼完整阅读链路
        run: bash scripts/run-live-source-smoke.sh
