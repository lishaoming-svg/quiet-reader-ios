name: 构建 iOS 测试包

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 运行单元测试
        run: bash scripts/run-tests.sh

      - name: 构建设备 IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: 上传无签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuietReader-unsigned-ipa
          path: build/QuietReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
